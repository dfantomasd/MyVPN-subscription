name: Refresh VLESS subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned sing-box probe runtime
        run: |
          curl -fsSLo /tmp/sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install /tmp/sing-box-1.14.0-linux-amd64/sing-box /usr/local/bin/sing-box
      - name: Fetch, rank and publish
        run: python community.py --output public --limit-per-source 200 --max-output 30
      - name: Commit changed publication
        run: |
          if [ -z "$(git status --porcelain -- public)" ]; then exit 0; fi
          git config user.name "myvpn-bot"
          git config user.email "myvpn-bot@users.noreply.github.com"
          git add public
          git commit -m "chore: refresh VLESS subscription"
          git push
      - name: Purge jsDelivr cache
        run: |
          curl --fail --silent --show-error \
            "https://purge.jsdelivr.net/gh/dfantomasd/MyVPN-subscription@main/public/happ.txt"
          curl --fail --silent --show-error \
            "https://purge.jsdelivr.net/gh/dfantomasd/MyVPN-subscription@main/public/karing.txt"
